<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portulan</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#bfe6ff">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Portulan">
<meta name="application-name" content="Portulan">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #bfe6ff; --panel: #ffffff; --paper: #fff8e6; --ink: #2b1f4a; --muted: #6a5f8a; --line: #2b1f4a;
  --outline: #2b1f4a; --on-accent: #2b1f4a;
  --cell: #2fcf7e; --cell-edge: #178a52; --track: #2b1f4a; --accent: #ffc933; --contour: #a5d3f3;
  --pink: #ff5d8f; --blue: #4aa8ff; --danger: #e0283f;
  --k1: #d3f7e4; --k2: #fff0b0; --k3: #ffd6e3; --k4: #d3e9ff;
  --nav: 68px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1b1330; --panel: #2d2147; --paper: #3a2c5c; --ink: #fff3d6; --muted: #b9acd9; --line: #0e0820;
    --outline: #0e0820; --contour: #2c2150; --cell: #35e08d; --cell-edge: #8bf2bd; --track: #fff3d6;
    --pink: #ff6f9c; --danger: #ff8090;
    --k1: #14513a; --k2: #5a4a12; --k3: #5a1f38; --k4: #17426b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1b1330; --panel: #2d2147; --paper: #3a2c5c; --ink: #fff3d6; --muted: #b9acd9; --line: #0e0820;
  --outline: #0e0820; --contour: #2c2150; --cell: #35e08d; --cell-edge: #8bf2bd; --track: #fff3d6;
  --pink: #ff6f9c; --danger: #ff8090;
  --k1: #14513a; --k2: #5a4a12; --k3: #5a1f38; --k4: #17426b;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); overflow: hidden;
  font-family: "Fredoka", ui-rounded, "Avenir Next Rounded", "Segoe UI", system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

/* ---- carte ---- */
#map { position: fixed; inset: 0; }
#map canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#bgGray { filter: grayscale(1) contrast(0.7) brightness(1.1); opacity: 0.42; pointer-events: none; }
#bgColor { pointer-events: none; }
#cv { touch-action: none; cursor: grab; }
#cv:active { cursor: grabbing; }

/* ---- surimpressions ---- */
.float { position: fixed; z-index: 5; }
#profileBtn {
  top: calc(env(safe-area-inset-top, 0px) + 12px); left: 12px;
  display: flex; align-items: center; gap: 8px; padding: 4px 16px 4px 4px;
  background: var(--panel); border: 3px solid var(--outline); border-radius: 999px;
  box-shadow: 3px 3px 0 var(--outline); font-weight: 600; font-size: 15px;
}
#profileBtn:active, #ctrl button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--outline); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--pink); color: #fff; border: 2.5px solid var(--outline); display: grid; place-items: center; font-weight: 700; font-size: 15px; }
#chip {
  top: calc(env(safe-area-inset-top, 0px) + 12px); right: 12px; text-align: right; line-height: 1.05;
  background: var(--accent); color: var(--on-accent); border: 3px solid var(--outline); border-radius: 18px;
  padding: 6px 14px; box-shadow: 3px 3px 0 var(--outline); transform: rotate(2deg);
}
#chip b { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
#chip span { font-size: 13px; font-weight: 600; }
#chip small { display: block; font-size: 12px; font-weight: 500; margin-top: 1px; }
#chip.pop { animation: pop 0.55s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: rotate(2deg) scale(1); } 35% { transform: rotate(-4deg) scale(1.22); } 100% { transform: rotate(2deg) scale(1); } }
#ctrl { right: 12px; bottom: calc(var(--nav) + env(safe-area-inset-bottom, 0px) + 54px); display: flex; flex-direction: column; gap: 10px; }
#ctrl button { width: 44px; height: 44px; border-radius: 50%; background: var(--panel); border: 3px solid var(--outline); box-shadow: 2px 3px 0 var(--outline); display: grid; place-items: center; font-size: 22px; font-weight: 700; }
#ctrl svg { width: 20px; height: 20px; stroke-width: 2.6; }
.tag {
  bottom: calc(var(--nav) + env(safe-area-inset-bottom, 0px) + 10px);
  font-size: 11px; font-weight: 500; color: var(--ink); background: var(--panel); border: 2px solid var(--outline);
  border-radius: 10px; padding: 3px 8px; pointer-events: none;
}
#scalebar { left: 10px; } #attr { right: 10px; max-width: 58%; text-align: right; }
#scalebar i { display: block; height: 6px; border: 2px solid var(--outline); border-top: 0; margin-bottom: 2px; }
body.sheet-open #ctrl, body.sheet-open .tag { display: none; }
#hint {
  left: 16px; right: 16px; margin: 0 auto; max-width: 380px; text-align: center;
  bottom: calc(var(--nav) + env(safe-area-inset-bottom, 0px) + 28px);
  background: var(--panel); border: 3px solid var(--outline); border-radius: 24px; padding: 20px 18px;
  box-shadow: 5px 5px 0 var(--outline); transform: rotate(-1deg);
}
#hint h2 { margin: 0 0 6px; font-size: 24px; font-weight: 700; }
#hint p { margin: 0 0 16px; color: var(--muted); font-size: 15px; line-height: 1.4; }
#hint[hidden] { display: none; }
#toast {
  left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px);
  bottom: calc(var(--nav) + env(safe-area-inset-bottom, 0px) + 16px);
  background: var(--ink); color: var(--panel); border: 3px solid var(--outline); border-radius: 16px;
  box-shadow: 3px 3px 0 var(--outline); padding: 10px 14px; font-size: 14px; font-weight: 500; z-index: 30;
}
#toast[hidden] { display: none; }

/* ---- barre de menu ---- */
#nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex;
  height: calc(var(--nav) + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--panel); border-top: 3px solid var(--outline);
}
.tab { flex: 1; background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 12px; font-weight: 600; position: relative; }
.tab svg, .tab span { position: relative; z-index: 1; }
.tab svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"]::before {
  content: ""; position: absolute; top: 8px; left: 50%; width: 56px; height: 34px; margin-left: -28px;
  border-radius: 17px; background: var(--accent); border: 3px solid var(--outline); box-shadow: 2px 2px 0 var(--outline);
}
.tab[aria-selected="true"] svg { color: var(--on-accent); }

/* ---- fenêtres ---- */
#sheet {
  position: fixed; z-index: 15; left: 0; right: 0; margin: 0 auto; max-width: 560px;
  bottom: calc(var(--nav) + env(safe-area-inset-bottom, 0px));
  max-height: 72vh; display: flex; flex-direction: column;
  background: var(--paper); border: 3px solid var(--outline); border-bottom: 0; border-radius: 26px 26px 0 0;
  transform: translateY(105%); transition: transform 0.38s cubic-bezier(.34, 1.4, .64, 1); visibility: hidden;
}
#sheet.open { transform: none; visibility: visible; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
.sheet-head h2 { margin: 0; font-size: 24px; font-weight: 700; }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--outline); background: var(--pink); color: #fff; display: grid; place-items: center; box-shadow: 2px 2px 0 var(--outline); }
.iconbtn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--outline); }
.iconbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; }
.sheet-body { overflow-y: auto; padding: 4px 16px 20px; -webkit-overflow-scrolling: touch; }
@media (prefers-reduced-motion: reduce) { #sheet, #drawer { transition: none; } #chip.pop { animation: none; } }

.field { margin-bottom: 12px; }
.field label { display: block; font-size: 14px; font-weight: 500; color: var(--muted); margin-bottom: 4px; }
.field select, .field input[type="date"], .field input[type="text"], .field input[type="number"] {
  width: 100%; padding: 10px 12px; background: var(--panel); border: 3px solid var(--outline); border-radius: 14px; font-size: 16px; font-weight: 500;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; padding: 11px 20px; border-radius: 999px;
  border: 3px solid var(--outline); background: var(--cell); color: var(--on-accent); font-weight: 700; font-size: 16px;
  box-shadow: 3px 3px 0 var(--outline);
}
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--outline); }
.btn.ghost { background: var(--panel); color: var(--ink); }
.btn.danger { background: var(--panel); color: var(--danger); }
.btn.block { display: flex; width: 100%; margin-bottom: 10px; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop:focus-within { outline: 3px solid var(--blue); outline-offset: 2px; }
.note { font-size: 13px; color: var(--muted); line-height: 1.45; margin: 12px 0 0; }
.result { background: var(--panel); border: 3px solid var(--outline); border-radius: 16px; padding: 10px 12px; margin-top: 12px; font-size: 14px; box-shadow: 3px 3px 0 var(--outline); }
.result b { font-weight: 700; }
.result .gain { display: inline-block; margin-top: 4px; background: var(--accent); color: var(--on-accent); font-weight: 700; padding: 1px 10px; border: 2px solid var(--outline); border-radius: 999px; }

.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: 0; border-top: 2px dashed color-mix(in srgb, var(--outline) 28%, transparent); padding: 12px 0; }
.row:first-child { border-top: 0; }
.row .main { flex: 1; min-width: 0; }
.row .t { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
.row .v { text-align: right; font-weight: 700; font-size: 19px; font-variant-numeric: tabular-nums; }
.row .v small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
.row .del { font-size: 12px; font-weight: 600; color: var(--danger); background: none; border: 0; padding: 6px; }
.empty-line { color: var(--muted); font-size: 15px; padding: 16px 0; }

.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 14px; }
.kpi { border: 3px solid var(--outline); border-radius: 18px; padding: 10px 12px; box-shadow: 3px 3px 0 var(--outline); }
.kpi:nth-child(1) { background: var(--k1); } .kpi:nth-child(2) { background: var(--k2); }
.kpi:nth-child(3) { background: var(--k3); } .kpi:nth-child(4) { background: var(--k4); }
.kpi b { display: block; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 13px; font-weight: 500; color: var(--muted); }
h3 { font-size: 15px; margin: 18px 0 8px; color: var(--ink); font-weight: 700; }
svg.chart { width: 100%; height: auto; display: block; background: var(--panel); border: 3px solid var(--outline); border-radius: 16px; }
.chart .fill { fill: var(--cell); opacity: 0.3; }
.chart .ln { fill: none; stroke: var(--cell-edge); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
.chart text { fill: var(--muted); font-size: 9px; }
.bars { display: flex; align-items: flex-end; gap: 8px; height: 100px; }
.bars .bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; font-size: 11px; font-weight: 500; color: var(--muted); }
.bars .bar i { display: block; width: 100%; background: var(--cell); border: 2.5px solid var(--outline); border-bottom: 0; border-radius: 8px 8px 0 0; min-height: 4px; }
.bars .bar:nth-child(even) i { background: var(--pink); }
.seg { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.seg button { padding: 7px 14px; border-radius: 999px; border: 3px solid var(--outline); background: var(--panel); font-size: 14px; font-weight: 600; color: var(--ink); }
.seg4 { flex-wrap: nowrap; gap: 6px; }
.seg4 button { flex: 1 1 0; min-width: 0; padding: 7px 2px; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: clip; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); box-shadow: 2px 2px 0 var(--outline); }
.banner { font-size: 13px; font-weight: 500; background: var(--k2); border: 2.5px dashed var(--outline); border-radius: 14px; padding: 8px 12px; color: var(--ink); margin-bottom: 12px; line-height: 1.4; }
.rank-n { width: 28px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.me { background: var(--accent); color: var(--on-accent); border: 3px solid var(--outline); border-radius: 16px; padding: 8px 12px; margin: 4px 0; box-shadow: 3px 3px 0 var(--outline); }
.me .s, .me small, .me .rank-n { color: var(--on-accent); }

/* ---- volet profil ---- */
#scrim { position: fixed; inset: 0; z-index: 24; background: rgba(43, 31, 74, 0.45); }
#scrim[hidden] { display: none; }
#drawer {
  position: fixed; z-index: 25; top: 0; bottom: 0; left: 0; width: min(88vw, 360px);
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  background: var(--paper); border-right: 3px solid var(--outline); border-radius: 0 26px 26px 0; overflow-y: auto;
  transform: translateX(-102%); transition: transform 0.38s cubic-bezier(.34, 1.3, .64, 1); visibility: hidden;
}
#drawer.open { transform: none; visibility: visible; }
.who { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.who .avatar { width: 58px; height: 58px; font-size: 26px; border-width: 3px; box-shadow: 3px 3px 0 var(--outline); }
.who input { flex: 1; min-width: 0; font-size: 20px; font-weight: 600; background: transparent; border: 0; border-bottom: 3px solid var(--outline); padding: 6px 0; }
.drawer-sec { margin-top: 18px; }

.avatar svg { width: 58%; height: 58%; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
.avatar.big { width: 88px; height: 88px; border-width: 3.5px; box-shadow: 3px 3px 0 var(--outline); padding: 0; margin: 0 auto 6px; display: grid; }
.avatar.big:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--outline); }
.caption { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.drawer-title { margin: 0 0 14px; font-size: 26px; font-weight: 700; }
.picker { background: var(--panel); border: 3px solid var(--outline); border-radius: 18px; padding: 12px; margin-bottom: 14px; }
.picker .btn { margin-bottom: 8px; }
.icons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.icons button { aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--outline); display: grid; place-items: center; padding: 0; }
.icons button svg { width: 56%; height: 56%; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
.icons button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--blue); }
.trophy-card { background: var(--k2); border: 3px solid var(--outline); border-radius: 20px; padding: 14px; box-shadow: 3px 3px 0 var(--outline); margin-top: 6px; }
.trophy-main { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.trophy-main .cup { width: 64px; height: 64px; flex: none; }
.trophy-card .lvl { font-weight: 700; font-size: 18px; }
.trophy-card .sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
.bar-track { height: 16px; border: 3px solid var(--outline); border-radius: 999px; background: var(--panel); overflow: hidden; margin-top: 4px; }
.bar-fill { height: 100%; background: var(--cell); border-right: 3px solid var(--outline); min-width: 4px; }
.cup { fill: none; stroke: var(--ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.cup.locked { opacity: 0.4; }
.cups { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-top: 12px; }
.cups .cup { width: 100%; height: auto; }
.locked { padding: 10px 12px; background: var(--panel); border: 3px dashed var(--outline); border-radius: 14px; font-size: 16px; font-weight: 600; min-height: 46px; word-break: break-word; }
/* ---- barre de la carte, recherche, glisser-déposer ---- */
#mapbar { top: calc(env(safe-area-inset-top, 0px) + 80px); left: 12px; right: 12px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 2px 6px; pointer-events: none; }
#mapbar::-webkit-scrollbar { display: none; }
#mapbar .pill { pointer-events: auto; }
.pill { flex: none; padding: 6px 14px; border-radius: 999px; border: 3px solid var(--outline); background: var(--panel); color: var(--ink); font-size: 14px; font-weight: 600; box-shadow: 2px 2px 0 var(--outline); }
.pill[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
body.sheet-open #mapbar { display: none; }
#searchbar { top: calc(env(safe-area-inset-top, 0px) + 12px); left: 12px; right: 12px; display: flex; gap: 8px; z-index: 7; }
#searchbar[hidden] { display: none; }
#searchbar input { flex: 1; min-width: 0; padding: 10px 14px; border: 3px solid var(--outline); border-radius: 999px; background: var(--panel); font-size: 16px; box-shadow: 3px 3px 0 var(--outline); }
#searchbar .btn { width: auto; padding: 8px 18px; }
#dropzone { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(43, 31, 74, 0.6); color: #fff; font-size: 24px; font-weight: 700; text-align: center; padding: 24px; }
#dropzone[hidden] { display: none; }
/* ---- défis, succès, sommets ---- */
.goal { padding: 10px 0; border-top: 2px dashed color-mix(in srgb, var(--outline) 28%, transparent); }
.goal:first-of-type { border-top: 0; }
.goal-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.goal .t { font-weight: 600; font-size: 16px; }
.goal .del { font-size: 12px; font-weight: 600; color: var(--danger); background: none; border: 0; padding: 6px; }
.goal .s { font-size: 13px; color: var(--muted); margin-top: 4px; }
.badges { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.badge { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border: 3px solid var(--outline); border-radius: 16px; background: var(--panel); box-shadow: 2px 2px 0 var(--outline); }
.badge .ic { font-size: 24px; }
.badge b { font-size: 14px; }
.badge small { font-size: 12px; color: var(--muted); line-height: 1.25; }
.badge.off { opacity: 0.45; filter: grayscale(1); border-style: dashed; box-shadow: none; }
.peak { font-weight: 600; }
.poi { padding: 10px 12px; margin-bottom: 10px; border: 3px solid var(--outline); border-radius: 16px; background: var(--panel); box-shadow: 2px 2px 0 var(--outline); }
.poi-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.poi .t { font-weight: 600; font-size: 16px; }
.poi .v { font-weight: 700; font-size: 16px; white-space: nowrap; }
.poi .v small { font-size: 12px; color: var(--muted); margin-left: 2px; }
.poi .s { font-size: 13px; color: var(--muted); margin-top: 3px; }
.poi-act { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.linkbtn { display: inline-block; padding: 5px 12px; border: 2.5px solid var(--outline); border-radius: 999px; background: var(--panel); color: var(--ink); font-size: 13px; font-weight: 600; text-decoration: none; box-shadow: 2px 2px 0 var(--outline); cursor: pointer; }
a.linkbtn { background: var(--accent); color: var(--on-accent); }
.poi-info { margin-top: 8px; font-size: 14px; line-height: 1.4; }
.poi-go { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; width: 100%; padding: 0; margin: 0; background: none; border: 0; text-align: left; color: inherit; font: inherit; cursor: pointer; }
#poicard { left: 12px; right: 12px; bottom: calc(var(--nav) + env(safe-area-inset-bottom, 0px) + 14px); padding: 12px 14px; max-height: 42vh; overflow-y: auto; background: var(--panel); border: 3px solid var(--outline); border-radius: 18px; box-shadow: 4px 4px 0 var(--outline); z-index: 9; }
#poicard[hidden] { display: none; }
body.sheet-open #poicard { display: none; }
.pc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.pc-t { font-weight: 700; font-size: 17px; }
.pc-x { flex: none; width: 34px; height: 34px; border-radius: 999px; border: 2.5px solid var(--outline); background: var(--panel); color: var(--ink); font-size: 16px; font-weight: 700; cursor: pointer; }

<script src="https://cdn.jsdelivr.net/npm/h3-js@4.1.0/dist/h3-js.umd.js"></script>

  var SPORT_WEIGHT = { all: 1, trail: 0.35, course: 0.3, rando: 0.45, velo: 0.6, ski: 0.15, natation: 0.04, pagaie: 0.06, voile: 0.05, roller: 0.08, autre: 0.1 };
  function fakeBoard(scope, period, sport) {
    var sp = sport || "all", base = { monde: 160, france: 70, region: 22 }[scope] * (period === "month" ? 0.14 : 1) * (SPORT_WEIGHT[sp] || 0.1), seed = scope.length * 97 + (period === "month" ? 13 : 5);
    for (var c = 0; c < sp.length; c++) seed += sp.charCodeAt(c) * 31;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    return FAKE.map(function (nm, i) { return { name: nm, v: base * Math.pow(0.8, i) * (0.9 + 0.2 * rnd()) }; });
  }
  function userScore(period, sport) {
    var ym = todayISO().slice(0, 7), seen = new Set(), s = 0;
    sortedActs().filter(function (a) { return a.trust !== "non" && (!sport || sport === "all" || a.sport === sport); }).forEach(function (a) {   // classement : courses avec capteur
      var n = 0;
      actCells(a).forEach(function (c) { if (!seen.has(c)) { seen.add(c); n++; } });
      if (period === "all" || a.date.slice(0, 7) === ym) s += n * AREA_M2 / 1e6;
    });
    return s;
  }
  function viewRank() {
    var me = userScore(rankPeriod, rankSport), board = fakeBoard(rankScope, rankPeriod, rankSport), rank = 1 + board.filter(function (b) { return b.v > me; }).length;
    var rows = board.map(function (b, i) { return { r: i + 1, name: b.name, v: b.v, me: false }; });
    rows.splice(rank - 1, 0, { r: rank, name: S.name || "Moi", v: me, me: true });
    rows.forEach(function (x, i) { x.r = i + 1; });
    var top = rows.slice(0, 8), meRow = rows.filter(function (x) { return x.me; })[0], extra = meRow.r > 8;
    function seg(group, items, cur) { return '<div class="seg">' + items.map(function (it) { return '<button data-' + group + '="' + it[0] + '" aria-pressed="' + (cur === it[0]) + '">' + it[1] + '</button>'; }).join("") + '</div>'; }
    function row(x) { return '<div class="row' + (x.me ? ' me' : '') + '"><span class="rank-n">' + x.r + '</span><span class="main"><span class="t">' + esc(x.name) + (x.me ? " (toi)" : "") + '</span></span><span class="v">' + fmtKm2(x.v) + '<small>km²</small></span></div>'; }
    return '<div class="banner">Aperçu avec des joueurs fictifs. Un vrai classement mondial ou régional demande des comptes et un serveur ; ton score ci-dessous est réel et ne compte que les courses avec données de capteur.</div>' +
      seg("sport", [["all", "Tous sports"]].concat(Object.keys(SPORTS).map(function (k) { return [k, sl(k)]; })), rankSport) +
      seg("scope", [["monde", "Monde"], ["france", "Pays"], ["region", "Région"]], rankScope) +
      seg("period", [["all", "Total"], ["month", "Ce mois-ci"]], rankPeriod) +
      top.map(row).join("") + (extra ? '<div class="s" style="text-align:center;color:var(--muted);padding:4px 0">…</div>' + row(meRow) : "");
  }

  function bindSheet() {
    var cb = $("commit"); if (cb) cb.addEventListener("click", commitPending);
    var xb = $("cancel"); if (xb) xb.addEventListener("click", function () { pending = null; render(); draw(); });
    var sb = $("shareBtn"); if (sb) sb.addEventListener("click", shareMap);
    document.querySelectorAll("[data-gquick]").forEach(function (b) { b.addEventListener("click", function () { var q = QUICK[+b.dataset.gquick]; S.goals.push({ type: q.type, target: q.target, period: q.period }); save(); render(); }); });
    var ga = $("gadd"); if (ga) ga.addEventListener("click", function () { var t = parseFloat($("gtarget").value); if (!(t > 0)) { toast("Indique un objectif supérieur à 0."); return; } S.goals.push({ type: $("gtype").value, target: t, period: $("gper").value }); save(); render(); });
    document.querySelectorAll("[data-gdel]").forEach(function (b) { b.addEventListener("click", function () { S.goals.splice(+b.dataset.gdel, 1); save(); render(); }); });
    var gi = $("gpxin");
    if (gi) gi.addEventListener("change", function (e) {
      var files = Array.prototype.slice.call(e.target.files || []);
      if (!files.length) return;
      importFiles(files, $("sp").value, $("dt").value || todayISO()).then(function () { e.target.value = ""; });
    });
    document.querySelectorAll("[data-act]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = parseInt(b.dataset.act, 10), a = S.activities.filter(function (x) { return x.id === id; })[0];
        if (!a) return;
        selected = id; closeSheet(); fitLines(a.lines); draw();
      });
    });
    document.querySelectorAll("[data-del]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = parseInt(b.dataset.del, 10), a = S.activities.filter(function (x) { return x.id === id; })[0];
        if (!a || !window.confirm("Supprimer « " + a.name + " » ? Le territoire découvert uniquement grâce à cette course sera retiré.")) return;
        S.activities = S.activities.filter(function (x) { return x.id !== id; });
        if (selected === id) selected = null;
        rebuild(); save(); draw(); render();
      });
    });
    document.querySelectorAll("[data-scope]").forEach(function (b) { b.addEventListener("click", function () { rankScope = b.dataset.scope; render(); }); });
    var rs = $("rescanBtn"); if (rs) rs.addEventListener("click", recomputeAll);
    document.querySelectorAll("[data-go]").forEach(function (b) { b.addEventListener("click", function () { goToPoi(poiIdx[b.dataset.go]); }); });
    document.querySelectorAll("[data-succ]").forEach(function (b) { b.addEventListener("click", function () { succTab = b.dataset.succ; render(); }); });
    document.querySelectorAll("[data-info]").forEach(function (b) { b.addEventListener("click", function () {
      var key = b.dataset.info, el = $("info-" + key);
      if (!el) return;
      if (!el.hidden) { el.hidden = true; return; }
      el.hidden = false; loadInfo(key);
    }); });
    document.querySelectorAll("[data-lsport]").forEach(function (b) { b.addEventListener("click", function () { listSport = b.dataset.lsport; render(); }); });
    document.querySelectorAll("[data-sport]").forEach(function (b) { b.addEventListener("click", function () { rankSport = b.dataset.sport; render(); }); });
    document.querySelectorAll("[data-period]").forEach(function (b) { b.addEventListener("click", function () { rankPeriod = b.dataset.period; render(); }); });
  }
  document.querySelectorAll(".tab").forEach(function (t) { t.addEventListener("click", function () { openTab(t.dataset.tab); }); });
  $("sheetClose").addEventListener("click", closeSheet);
  $("hintBtn").addEventListener("click", function () { openTab("add"); });

  /* ================= profil ================= */
  var ICONS = [
    { bg: "#ff5d8f", fg: "#fff", d: '<path d="M3 19l6-10 4 6 3-4 5 8z"/>' },
    { bg: "#ff8a3d", fg: "#fff", d: '<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>' },
    { bg: "#2fcf7e", fg: "#fff", d: '<path d="M12 3l5 7h-3l4 6H6l4-6H7zM12 16v5"/>' },
    { bg: "#4aa8ff", fg: "#fff", d: '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>' },
    { bg: "#a76bff", fg: "#fff", d: '<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>' },
    { bg: "#ffc933", fg: "#2b1f4a", d: '<path d="M12 3l2.7 5.8 6.3.8-4.6 4.3 1.2 6.3L12 17l-5.6 3.2 1.2-6.3L3 9.6l6.3-.8z"/>' },
    { bg: "#16b8a6", fg: "#fff", d: '<path d="M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9z"/>' },
    { bg: "#ff6b6b", fg: "#fff", d: '<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>' }
  ];
  var TROPHIES = [
    { km: 0.1, name: "Promeneur",   c: "#c9803c" },
    { km: 0.5, name: "Éclaireur",   c: "#c9803c" },
    { km: 1,   name: "Randonneur",  c: "#b8c2cc" },
    { km: 2.5, name: "Pisteur",     c: "#b8c2cc" },
    { km: 5,   name: "Explorateur", c: "#ffc933" },
    { km: 10,  name: "Aventurier",  c: "#ffc933" },
    { km: 25,  name: "Conquérant",  c: "#4fd0ff" },
    { km: 50,  name: "Légende",     c: "#ff5dd8" }
  ];
  var drawerView = "profile", picker = false;

  function levelOf(km) { var l = 0; for (var i = 0; i < TROPHIES.length; i++) { if (km >= TROPHIES[i].km) l = i + 1; } return l; }
  function paintAvatar(el) {
    if (!el) return;
    if (S.photo) {
      el.style.backgroundColor = "var(--panel)"; el.style.backgroundImage = 'url("' + S.photo + '")';
      el.style.backgroundSize = "cover"; el.style.backgroundPosition = "center"; el.innerHTML = "";
    } else {
      var ic = ICONS[S.icon] || ICONS[0];
      el.style.backgroundImage = "none"; el.style.backgroundColor = ic.bg; el.style.color = ic.fg;
      el.innerHTML = '<svg viewBox="0 0 24 24">' + ic.d + '</svg>';
    }
  }
  function cupSvg(color, locked) {
    return '<svg class="cup' + (locked ? " locked" : "") + '" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0z" fill="' + color + '"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 14v4M8 20h8"/></svg>';
  }
  function trophyHTML() {
    var km = totalKm2(), lvl = levelOf(km), cur = lvl ? TROPHIES[lvl - 1] : null, next = TROPHIES[lvl] || null;
    var base = cur ? cur.km : 0, pct = next ? Math.max(0, Math.min(100, (km - base) / (next.km - base) * 100)) : 100;
    var h = '<div class="trophy-card"><div class="trophy-main">' + cupSvg(cur ? cur.c : "#d8d2e6", !cur) +
      '<div><div class="lvl">' + (cur ? "Niveau " + lvl + " · " + cur.name : "Pas encore de trophée") + '</div><div class="sub">' + fmtKm2(km) + ' km² découverts</div></div></div>';
    h += next
      ? '<div class="bar-track"><div class="bar-fill" style="width:' + pct.toFixed(0) + '%"></div></div><div class="sub">Prochain trophée : ' + next.name + ' à ' + fmt(next.km, next.km % 1 ? 1 : 0) + ' km²</div>'
      : '<div class="sub">Niveau maximum atteint, bravo !</div>';
    h += '<div class="cups">' + TROPHIES.map(function (tr, i) { return cupSvg(i < lvl ? tr.c : "#d8d2e6", i >= lvl); }).join("") + '</div></div>';
    return h;
  }
  function recapRow(label, value) {
    var v = (value || "").trim();
    return '<div class="field"><label>' + label + '</label><div class="locked">' + (v ? esc(v) : '<span style="color:var(--muted);font-weight:500">Non renseigné</span>') + '</div></div>';
  }
  function profileHTML() {
    var pk = picker
      ? '<div class="picker"><label class="btn ghost block drop">Choisir une photo<input type="file" id="photoin" accept="image/*"></label>' +
        (S.photo ? '<button class="btn ghost block" id="photodel">Retirer la photo</button>' : "") +
        '<div class="field" style="margin:6px 0 8px"><label>Ou choisis une icône</label></div><div class="icons">' +
        ICONS.map(function (ic, i) { return '<button data-ic="' + i + '" aria-label="Icône ' + (i + 1) + '" aria-pressed="' + (!S.photo && S.icon === i) + '" style="background:' + ic.bg + ';color:' + ic.fg + '"><svg viewBox="0 0 24 24">' + ic.d + '</svg></button>'; }).join("") +
        '</div></div>'
      : "";
    return '<h2 class="drawer-title">' + "Mon profil" + '</h2>' +
      '<button class="avatar big" id="avatarBtn" aria-label="Changer ma photo ou mon icône"></button>' +
      '<div class="caption">Touche l’image pour la modifier</div>' + pk +
      recapRow("Pseudo", S.name) + recapRow("Ville", S.city) + recapRow("Département", S.dept) +
      '<h3>Mon trophée</h3>' + trophyHTML() +
      '<div class="drawer-sec"><button class="btn ghost block" id="gosettings">Réglages</button><button class="btn ghost block" id="dclose">Fermer</button></div>';
  }
  function settingsHTML() {
    var bm = [["relief", "Relief ombré (discret)"], ["esri", "Satellite (monde)"], ["ign", "Satellite IGN (France)"], ["none", "Aucun fond"]].map(function (o) { return '<option value="' + o[0] + '"' + (S.basemap === o[0] ? " selected" : "") + '>' + o[1] + '</option>'; }).join("");
    return '<h2 class="drawer-title">Réglages</h2>' +
      '<div class="field"><label for="bmsel">Fond de carte</label><select id="bmsel">' + bm + '</select></div>' +
      stravaSettingsHTML() +
      '<div class="drawer-sec"><button class="btn ghost block" id="scanpk">Tout recalculer (sommets, lieux, communes)</button></div>' +
      '<div class="drawer-sec"><button class="btn ghost block" id="updapp">Mettre à jour l’appli (vider le cache)</button></div>' +
      '<div class="drawer-sec"><button class="btn ghost block" id="diagbtn">Diagnostic de connexion</button><pre class="diag" id="diagout" hidden></pre></div>' +
      '<p class="note">À utiliser si de nouveaux sommets ou lieux ont été ajoutés sur OpenStreetMap, ou pour corriger les surfaces de communes. Les nouvelles courses sont analysées automatiquement.</p>' +
      '<div class="drawer-sec"><button class="btn ghost block" id="exp">Exporter mes données (JSON)</button>' +
      '<label class="btn ghost block drop">Importer une sauvegarde<input type="file" id="imp" accept="application/json,.json"></label>' +
      '<button class="btn danger block" id="wipe">Tout effacer</button></div>' +
      '<p class="note">Version de l’appli : ' + BUILD + '</p>' +
      '<p class="note">Stockage de l’appli : ' + storageInfo() + '</p>' +
      '<p class="note">Sommets et lieux : ' + S.activities.filter(function (a) { return a.sumDone && a.lmDone && a.poiV === 2; }).length + ' / ' + S.activities.length + ' courses analysées' + (S.activities.some(function (a) { return !a.sumDone || !a.lmDone || a.poiV !== 2; }) ? poiFailText() + (lastPoiError ? ' · dernière erreur réseau : ' + esc(lastPoiError) : '') : '') + '.</p>' +
      (/claude|anthropic/i.test(location.hostname) ? '<p class="note">Cette page est un aperçu : les recherches en ligne (sommets, lieux, communes, résumés Wikipédia) y sont bloquées. Ouvre l’appli à son adresse hébergée.</p>' : '') +
      '<p class="note">Dernière sauvegarde : ' + (S.lastBackup ? new Date(S.lastBackup).toLocaleDateString("fr-FR") : "jamais") + '.</p>' +
      '<p class="note">Tes courses sont stockées uniquement dans ce navigateur. Sans compte ni serveur, elles ne se synchronisent pas entre appareils : utilise l’export pour les déplacer.</p>' +
      '<div class="drawer-sec"><button class="btn ghost block" id="sback">Retour au profil</button></div>';
  }
  function squarePhoto(file) {
    return new Promise(function (res, rej) {
      var rd = new FileReader();
      rd.onerror = function () { rej(new Error("lecture impossible")); };
      rd.onload = function () {
        var img = new Image();
        img.onerror = function () { rej(new Error("image illisible")); };
        img.onload = function () {
          var s = Math.min(img.width, img.height), c = document.createElement("canvas");
          c.width = c.height = 160;
          c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 160, 160);
          res(c.toDataURL("image/jpeg", 0.82));
        };
        img.src = String(rd.result);
      };
      rd.readAsDataURL(file);
    });
  }
  function renderDrawer() {
    $("drawer").innerHTML = drawerView === "settings" ? settingsHTML() : profileHTML();
    if (drawerView === "settings") bindSettings(); else bindProfile();
  }
  function bindProfile() {
    paintAvatar($("avatarBtn"));
    $("avatarBtn").addEventListener("click", function () { picker = !picker; renderDrawer(); });
    var pi = $("photoin");
    if (pi) pi.addEventListener("change", function (e) {
      var f = e.target.files && e.target.files[0]; if (!f) return;
      squarePhoto(f).then(function (url) { S.photo = url; save(); picker = false; paintAvatar($("avatarMini")); renderDrawer(); })
        .catch(function (err) { toast("Photo impossible : " + err.message); });
      e.target.value = "";
    });
    var pd = $("photodel");
    if (pd) pd.addEventListener("click", function () { S.photo = ""; save(); paintAvatar($("avatarMini")); renderDrawer(); });
    document.querySelectorAll("[data-ic]").forEach(function (b) {
      b.addEventListener("click", function () { S.icon = parseInt(b.dataset.ic, 10); S.photo = ""; save(); picker = false; paintAvatar($("avatarMini")); renderDrawer(); });
    });
    var dc = $("dclose"); if (dc) dc.addEventListener("click", closeDrawer);
    var gs = $("gosettings"); if (gs) gs.addEventListener("click", function () { drawerView = "settings"; renderDrawer(); });
  }
  function bindSettings() {
    $("bmsel").addEventListener("change", function (e) { S.basemap = e.target.value; tilesLoaded = 0; tilesFailed = 0; save(); draw(); });
    $("scanpk").addEventListener("click", recomputeAll);
    $("updapp").addEventListener("click", forceUpdate);
    $("diagbtn").addEventListener("click", runDiagnostic);
    bindStrava();
    $("exp").addEventListener("click", function () {
      S.lastBackup = Date.now(); save();
      var blob = new Blob([JSON.stringify({ app: "hexplore", version: 1, data: Object.assign({}, S, { strava: undefined }) })], { type: "application/json" });
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "portulan-sauvegarde.json"; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    });
    $("imp").addEventListener("change", function (e) {
      var f = e.target.files && e.target.files[0]; if (!f) return;
      readFile(f).then(function (txt) {
        var o = JSON.parse(txt), d = o && o.data; if (!d || !Array.isArray(d.activities)) throw new Error("format inconnu");
        var added = 0;
        d.activities.forEach(function (a) {
          if (!a || !Array.isArray(a.lines) || !a.date) return;
          var dup = S.activities.some(function (x) { return x.date === a.date && Math.abs(x.dist - a.dist) < 20 && x.name === a.name; });
          if (dup) return;
          S.activities.push({ id: S.nextId++, name: String(a.name || "Course"), sport: SPORTS[a.sport] ? a.sport : "autre", date: String(a.date), dist: +a.dist || 0, skipped: +a.skipped || 0, lines: a.lines, trust: a.trust === "non" ? "non" : "ok", summits: Array.isArray(a.summits) ? a.summits : [], sumDone: !!a.sumDone, landmarks: Array.isArray(a.landmarks) ? a.landmarks : [], lmDone: !!a.lmDone, poiV: a.poiV === 2 ? 2 : 0, t0: +a.t0 || 0, strava: +a.strava || 0 });
          added++;
        });
        rebuild(); save(); fitAll(); renderDrawer(); toast(added + " course" + (added > 1 ? "s" : "") + " importée" + (added > 1 ? "s" : ""));
      }).catch(function (err) { toast("Import impossible : " + err.message); });
      e.target.value = "";
    });
    $("wipe").addEventListener("click", function () {
      if (!window.confirm("Effacer toutes les courses et le territoire découvert ? Cette action est définitive.")) return;
      S.activities = []; S.strava.lastSync = 0; selected = null; rebuild(); save(); draw(); renderDrawer();
    });
    $("sback").addEventListener("click", function () { drawerView = "profile"; renderDrawer(); });
  }
  function openDrawer() { closeSheet(); drawerView = "profile"; picker = false; renderDrawer(); $("drawer").classList.add("open"); $("drawer").setAttribute("aria-hidden", "false"); $("scrim").hidden = false; }
  function closeDrawer() {
    $("drawer").classList.remove("open"); $("drawer").setAttribute("aria-hidden", "true"); $("scrim").hidden = true;
  }
  $("profileBtn").addEventListener("click", openDrawer);
  $("scrim").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { closeDrawer(); closeSheet(); } });

  /* ================= démarrage ================= */
  window.addEventListener("resize", resize);
  if (typeof h3 === "undefined") {
    toast("La bibliothèque H3 n’a pas pu se charger : vérifie ta connexion.");
  } else {
    AREA_M2 = h3.getHexagonAreaAvg(RES, "m2");
    loadState();
    if (!S.activities.length) {
      var demo = [], seed = 7, i;
      var rnd = function () { seed = (seed * 16807) % 2147483647; return seed / 2147483647 - 0.5; };
      for (i = 0; i <= 700; i++) {
        var a = i / 700 * 2 * Math.PI, r = 0.011 + 0.003 * Math.sin(3 * a) + 0.0015 * Math.cos(5 * a);
        demo.push({ p: [45.9 + r * 0.72 * Math.sin(a) + rnd() * 0.00006, 6.13 + r * Math.cos(a) + rnd() * 0.00008], t: null });
      }
      var b = buildLines(demo, 60);
      S.activities.push({ id: S.nextId++, name: "Boucle d’exemple", sport: "trail", date: todayISO(), dist: b.dist, skipped: 0, lines: b.lines, summits: [], landmarks: [], sumDone: true, lmDone: true, poiV: 2 });   // exemple : aucune recherche en ligne
    }
    resize(); rebuild(); checkAchievements(true); initExtras();
    if (S.activities.length) fitAll(); else draw();
  }
})();
</script>
